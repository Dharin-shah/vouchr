name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * 1'

# Superseded PR runs auto-cancel (the scheduled scan is unaffected — distinct ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking PR gate: a PR that introduces a high+ advisory red-X's here.
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API; needs pull-requests: read
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Default ruleset plus the root .gitleaks.toml, whose only exception is one exact synthetic
      # fixture value in test/audit.test.ts's history: test/, examples/ and docs are otherwise scanned
      # like src/. The scheduled full-history scan proves it weekly. Version pinned (#217).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          # No GITLEAKS_LICENSE: org-level scanning needs one, but plain repo
          # scans run free with the default ruleset.
      # #217 acceptance: a credential-like value under test/** must FAIL THIS repo's scan (the root
      # .gitleaks.toml exempts nothing but one exact historical fixture value). Uses the binary the
      # action just installed on the checkout itself with the repo config, holding one randomly
      # generated AWS-shaped key that is written for the scan and removed — nothing credential-shaped
      # is committed (SEC-1).
      - name: "Canary: a credential-shaped value under test/** fails this repo's scan"
        run: |
          printf 'export const fixture = "AKIA%s";\n' "$(LC_ALL=C tr -dc 'A-Z2-7' </dev/urandom | head -c 16)" > test/gitleaks-canary.test.ts
          set +e; gitleaks dir . --config .gitleaks.toml --no-banner >/dev/null 2>&1; rc=$?; set -e
          rm -f test/gitleaks-canary.test.ts
          [ "$rc" = 1 ] || { echo "::error::this repo's gitleaks config did not flag a credential-shaped value under test/** (exit $rc; 1 = leak found)"; exit 1; }
          echo "this repo's gitleaks scan flags a credential-shaped value under test/**"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Non-blocking: generate a CycloneDX SBOM and publish it as an artifact.
      - name: Generate SBOM
        run: npx -y @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom.json
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

  # Blocking gate on PRs and main (#180): a dependency with a CVSS >= 7 NVD/KEV/RetireJS finding
  # red-X's here. CVE data comes baked into the action's base image (rebuilt regularly upstream;
  # the SHA pin fixes the entrypoint, not the scanner image), which is why the action runs the
  # CLI with --noupdate.
  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
      # The Node Package Analyzer resolves the packages actually installed; without node_modules
      # it warns and the scan is near-empty (green != scanned — the original #180 bug).
      - run: npm ci
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: Vouchr
          path: .
          format: HTML
          out: reports/dependency-check
          # Caveat: the action's entrypoint expands this string UNQUOTED (all_args=$@), so it only
          # parses via shell word-splitting — no values with spaces, and the `**` excludes survive
          # only while nothing in the workspace glob-matches them. Verified against the pinned SHA.
          # npm audit is already a separate blocking job above. Disable Dependency-Check's duplicate
          # network analyzer so an npm Audit API outage cannot fail a completed NVD/KEV/RetireJS scan.
          args: >
            --failOnCVSS 7
            --enableRetired
            --disableOssIndex
            --disableNodeAudit
            --exclude **/node_modules/**
            --exclude **/dist/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: owasp-dependency-check
          path: reports/dependency-check
          if-no-files-found: warn
