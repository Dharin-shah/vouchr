name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly bounded higher-iteration property run (#217): a fresh seed and 25x the per-property loops.
  # Failures show in Actions; nothing opens issues.
  schedule:
    - cron: '13 3 * * 2'

# Superseded PR runs auto-cancel so pushes don't pile up burning minutes. The weekly schedule shares
# the main-ref group with pushes to main, so it must never be the one cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # engines says node >=22, so validate the current + next major consumers actually run on.
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vouchr
          POSTGRES_PASSWORD: vouchr
          POSTGRES_DB: vouchr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vouchr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The service publishes the same localhost:5432 the suite defaults to (test/support/pg.ts) and
    # `npm run pg:up` maps, so no VOUCHR_TEST_PG_URL override is needed; the suite's sentinel fails
    # if it is unreachable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Guardrail (AGENTS.md REV-2): ONE local-Postgres port. `pg:up`, the test default, the CI
      # services above and every doc must all say 5432 — when a doc drifted to a second port, readers
      # pointed .env at one container while `npm run pg:down` destroyed the other (same `vouchr-pg`
      # name). Runs once; git grep only sees tracked files.
      - name: "Docs and pg:up use one Postgres port (5432)"
        if: matrix.node == 22
        run: |
          if git grep -n 5433 -- '*.md' package.json test/support/pg.ts test/bench .github .env.example ':!.github/workflows/ci.yml' ':!CHANGELOG.md'; then
            echo "::error::local PostgreSQL is 5432 everywhere (docs, npm run pg:up, test default); drop the 5433 shown above"
            exit 1
          fi
      # Build BEFORE test: the compiled dist/ must exist for tests that inspect the shipped artifact
      # (e.g. the headless @slack-free module-graph check), and an emit/declaration break fails fast here.
      - run: npm run build
      # Both legs run the suite once: the 24 leg plain, the 22 leg with node:test native coverage so
      # the per-file src/** table prints in the job log, enforcing the #217 floor (lines 95 / branches
      # 87, set below the 97.8 / 90.9 post-PostgreSQL baseline measured at the commit that added it).
      # Property tests (test/property.test.ts) run a FIXED seed on push/PR so a red check is
      # reproducible byte-for-byte; the weekly schedule uses the run id as a fresh seed (logged, so
      # VOUCHR_TEST_SEED=<it> replays a failure) with 25x iterations.
      - run: npm test
        if: matrix.node != 22
        env:
          VOUCHR_TEST_SEED: ${{ github.event_name == 'schedule' && github.run_id || 20260905 }}
          VOUCHR_TEST_ITERS: ${{ github.event_name == 'schedule' && 25 || 1 }}
      - run: npm run test:coverage
        if: matrix.node == 22
        env:
          NODE_OPTIONS: --test-coverage-lines=95 --test-coverage-branches=87
          VOUCHR_TEST_SEED: ${{ github.event_name == 'schedule' && github.run_id || 20260905 }}
          VOUCHR_TEST_ITERS: ${{ github.event_name == 'schedule' && 25 || 1 }}
      # The advertised runnable dry-run example is a blocking regression: it exercises the real
      # first-use flow (admin enable → consent → egress gates) end to end, so a change like
      # deny-by-default that breaks first use fails here instead of only in a user's repo.
      - run: npm run example:dry-run

  # Exercises the PUBLISHED artifact (pack → install into a fresh project → resolve every
  # entrypoint/bin/type). Separate job: a packaging break is distinct from a test failure, and it
  # needs no Postgres. ~30s. Same Node matrix as `test`: the packed consumer must work on 22 AND the
  # next supported runtime (#217).
  pack-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run pack-smoke

  # Single required status for branch protection: green iff every CI job above succeeded. Requiring
  # THIS one context instead of each job means matrix changes (add/drop a Node version, an OS) never
  # strand a stale required check — the reason bare `test` got stuck when `test` became `test (22|24)`.
  # `if: always()` so it still runs (and reports failure) when a dependency fails rather than being skipped.
  ci-ok:
    if: always()
    needs: [test, pack-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "CI job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required CI job did not succeed: $r"; exit 1; }
          done
