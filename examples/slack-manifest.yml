# Slack app manifest for the Vouchr demo — the shape of the FINISHED app.
#
# Do not create an app from this file: Slack challenges the three request URLs below at submit time,
# and your app can't answer until it exists (it needs the signing secret this creation would produce).
# Create from `slack-manifest.bootstrap.yml` instead, then add the URLs once the app is running —
# QUICKSTART.md § 3. Use this file to review or re-apply the finished configuration.
#
# Replace YOUR_PUBLIC_URL with your tunnel HOST ONLY — no scheme, no trailing slash
# (`your-name.ngrok-free.app`); the `https://` is already in each URL below. With an
# ExpressReceiver, events, interactivity, and the slash command all post to /slack/events.
display_information:
  name: Vouchr
  description: Connect your accounts so agents can act on your behalf, without seeing your tokens.
features:
  app_home:
    home_tab_enabled: true    # the Vouchr App Home console: your connections + channel governance
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: vouchr
    always_online: true
  slash_commands:
    - command: /vouchr
      url: https://YOUR_PUBLIC_URL/slack/events
      description: Manage your connected accounts
      usage_hint: status | disconnect <provider> | connect-shared <provider>
      should_escape: false
oauth_config:
  # Every Connect link passes through a Slack sign-in check (#302); Slack redirects back here.
  # Set the app's client id/secret as VOUCHR_SLACK_CLIENT_ID + VOUCHR_SLACK_CLIENT_SECRET.
  redirect_urls:
    - https://YOUR_PUBLIC_URL/vouchr/oauth/slack
  scopes:
    bot:
      - app_mentions:read   # receive @-mentions
      - chat:write          # post Connect prompts / confirmation DMs
      - commands            # the /vouchr slash command
      - users:read          # offboarding (user_change)
      - channels:read       # conversations.info + conversations.members: channel class and membership (App Home, /vouchr, shared creds)
      - groups:read         # same, for private channels
      - mpim:read           # conversations.info: distinguish group DMs from governed private channels
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_URL/slack/events
    bot_events:
      - app_mention
      - app_home_opened     # render the App Home console
      - user_change         # auto-revoke a deactivated user's connections
  interactivity:
    is_enabled: true        # REQUIRED for the Connect button + key/connect-shared modals
    request_url: https://YOUR_PUBLIC_URL/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
