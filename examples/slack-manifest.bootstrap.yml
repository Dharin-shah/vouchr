# BOOTSTRAP manifest — use this one to CREATE the app. It is `slack-manifest.yml` with the three
# request URLs removed, because Slack challenges those URLs the moment you submit the manifest and
# your app cannot answer yet: it needs the SLACK_SIGNING_SECRET that only exists once the app is
# created. Create → copy the secrets → start the tunnel + app → then paste the URLs in the UI, where
# Slack verifies them against a live server. QUICKSTART.md § 3 is the full order.
#
# Keep this file in sync with slack-manifest.yml (which stays the reference for the finished app).
display_information:
  name: Vouchr
  description: Connect your accounts so agents can act on your behalf, without seeing your tokens.
features:
  app_home:
    home_tab_enabled: true    # the Vouchr App Home console: your connections + channel governance
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: vouchr
    always_online: true
  slash_commands:
    - command: /vouchr        # add its Request URL in Features → Slash Commands after the app runs
      description: Manage your connected accounts
      usage_hint: status | disconnect <provider> | connect-shared <provider>
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # receive @-mentions
      - chat:write          # post Connect prompts / confirmation DMs
      - commands            # the /vouchr slash command
      - users:read          # offboarding (user_change)
      - channels:read       # conversations.info + conversations.members: channel class and membership (App Home, /vouchr, shared creds)
      - groups:read         # same, for private channels
      - mpim:read           # conversations.info: distinguish group DMs from governed private channels
settings:
  # The bot events are declared here so you don't hand-pick them later; Slack keeps Events disabled
  # until you save a verified Request URL in Features → Event Subscriptions.
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened     # render the App Home console
      - user_change         # auto-revoke a deactivated user's connections
  interactivity:
    is_enabled: false       # turn ON in Features → Interactivity & Shortcuts when you add its URL —
                            # REQUIRED for the Connect button + key/connect-shared modals
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
