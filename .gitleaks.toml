# Gitleaks configuration for vouchr. gitleaks-action and `gitleaks git`/`gitleaks dir` on the checkout
# pick this file up automatically; security.yml's canary step proves the config still flags a
# credential-shaped value under test/**.
#
# The scheduled security scan walks the FULL git history. test/ is scanned exactly like src/: the
# credential-shaped fixtures the redaction/injection/crypto tests need (`xoxb-NOT-A-REAL-SLACK-TOKEN`
# and friends) pass the default ruleset on their own. The ONLY exception is one exact synthetic value
# in test/audit.test.ts's history (commit 880b2680, rewritten since): it is not a real secret, and
# rewriting history to drop it is worse than naming it here. No path is exempt: a global allowlist
# with `paths` skips the whole file even under condition = "AND" (verified on 8.30.1), so an entry
# here is always the exact value, never a path. Add one only for a confirmed false positive.
title = "vouchr gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "historical synthetic Slack-token fixture in test/audit.test.ts (880b2680), not a real secret"
regexTarget = "secret"
regexes = ['''^xoxb-123456789012-abcdefghijklmnop$''']
